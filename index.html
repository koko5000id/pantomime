  <style amp-custom>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000000; 
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #001a33 0%, #000510 60%, #000000 100%); /* Gradasi gelap dengan sentuhan biru navy */
    }

    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 123, 255, 0.1) 1px, transparent 1px), /* Grid Biru Transparan */
        linear-gradient(90deg, rgba(0, 123, 255, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .mecha-bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Efek partikel disesuaikan dengan warna Biru Elegant & Kuning Gold */
    .p-rocket {
      position: absolute;
      width: 4px;
      height: 35px;
      background: linear-gradient(to top, transparent, #007bff, #d4af37, #ffffff);
      box-shadow: 0 0 15px #007bff, 0 0 20px #d4af37;
      border-radius: 50% 50% 0 0;
      opacity: 0;
      animation: rocketFly 2.5s infinite linear;
    }

    .p-beam {
      position: absolute;
      width: 3px;
      height: 200px;
      opacity: 0;
      animation: beamShoot 1.8s infinite ease-in-out;
    }
    .p-beam.blue { background: linear-gradient(to top, transparent, #007bff, #ffffff); box-shadow: 0 0 18px #007bff; } /* Biru */
    .p-beam.red { background: linear-gradient(to top, transparent, #d4af37, #ffffff); box-shadow: 0 0 18px #d4af37; } /* Gold */
    .p-beam.yellow { background: linear-gradient(to top, transparent, #00e5ff, #ffffff); box-shadow: 0 0 18px #00e5ff; } /* Cyan Neon */

    .p-spark {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 14px solid #ffffff;
      filter: drop-shadow(0 0 10px #007bff);
      opacity: 0;
      animation: sparkFloat 2.8s infinite ease-out;
    }
    .p-spark.red { border-bottom-color: #f4d03f; filter: drop-shadow(0 0 10px #ffffff); } /* Aksen Gold */
    .p-spark.white { border-bottom-color: #00e5ff; filter: drop-shadow(0 0 10px #f4d03f); } /* Aksen Biru-Gold */

    .p-armor {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f4d03f;
      box-shadow: 0 0 12px #007bff;
      transform: rotate(45deg);
      opacity: 0;
      animation: armorFly 3.2s infinite linear;
    }

    .rk1 { left: 2%; bottom: -10%; animation-delay: 0s; }
    .rk2 { left: 8%; bottom: -10%; animation-delay: 0.8s; }
    .rk3 { left: 16%; bottom: -10%; animation-delay: 1.5s; }
    .rk4 { left: 24%; bottom: -10%; animation-delay: 0.3s; }
    .rk5 { left: 32%; bottom: -10%; animation-delay: 1.9s; }
    .rk6 { left: 40%; bottom: -10%; animation-delay: 0.6s; }
    .rk7 { left: 48%; bottom: -10%; animation-delay: 2.1s; }
    .rk8 { left: 56%; bottom: -10%; animation-delay: 1.1s; }
    .rk9 { left: 64%; bottom: -10%; animation-delay: 0.4s; }
    .rk10 { left: 72%; bottom: -10%; animation-delay: 1.7s; }
    .rk11 { left: 80%; bottom: -10%; animation-delay: 0.2s; }
    .rk12 { left: 88%; bottom: -10%; animation-delay: 1.3s; }
    .rk13 { left: 95%; bottom: -10%; animation-delay: 0.9s; }

    .bm1 { left: 5%; top: -25%; animation-delay: 0.1s; transform: rotate(-25deg); }
    .bm2 { left: 15%; top: -25%; animation-delay: 1.2s; transform: rotate(15deg); }
    .bm3 { left: 25%; top: -25%; animation-delay: 0.5s; transform: rotate(-10deg); }
    .bm4 { left: 35%; top: -25%; animation-delay: 1.8s; transform: rotate(20deg); }
    .bm5 { left: 45%; top: -25%; animation-delay: 0.3s; transform: rotate(-15deg); }
    .bm6 { left: 55%; top: -25%; animation-delay: 1.4s; transform: rotate(25deg); }
    .bm7 { left: 65%; top: -25%; animation-delay: 0.7s; transform: rotate(-20deg); }
    .bm8 { left: 75%; top: -25%; animation-delay: 1.9s; transform: rotate(10deg); }
    .bm9 { left: 85%; top: -25%; animation-delay: 0.4s; transform: rotate(-15deg); }
    .bm10 { left: 93%; top: -25%; animation-delay: 1.1s; transform: rotate(18deg); }

    .sp1 { left: 4%; bottom: 2%; animation-delay: 0.2s; }
    .sp2 { left: 12%; bottom: 8%; animation-delay: 1.3s; }
    .sp3 { left: 20%; bottom: 5%; animation-delay: 0.6s; }
    .sp4 { left: 28%; bottom: 12%; animation-delay: 2.0s; }
    .sp5 { left: 36%; bottom: 4%; animation-delay: 0.9s; }
    .sp6 { left: 44%; bottom: 10%; animation-delay: 1.6s; }
    .sp7 { left: 52%; bottom: 6%; animation-delay: 0.1s; }
    .sp8 { left: 60%; bottom: 14%; animation-delay: 2.2s; }
    .sp9 { left: 68%; bottom: 3%; animation-delay: 0.7s; }
    .sp10 { left: 76%; bottom: 9%; animation-delay: 1.4s; }
    .sp11 { left: 84%; bottom: 15%; animation-delay: 0.5s; }
    .sp12 { left: 92%; bottom: 7%; animation-delay: 1.8s; }

    .am1 { left: 10%; bottom: -5%; animation-delay: 0.4s; }
    .am2 { left: 26%; bottom: -5%; animation-delay: 1.7s; }
    .am3 { left: 42%; bottom: -5%; animation-delay: 0.8s; }
    .am4 { left: 58%; bottom: -5%; animation-delay: 2.3s; }
    .am5 { left: 74%; bottom: -5%; animation-delay: 1.1s; }
    .am6 { left: 90%; bottom: -5%; animation-delay: 0.3s; }

    @keyframes rocketFly {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(-115vh) scale(1.5); opacity: 0; }
    }

    @keyframes beamShoot {
      0% { transform: translateY(0) scaleY(0.4); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.9; }
      100% { transform: translateY(125vh) scaleY(1.8); opacity: 0; }
    }

    @keyframes sparkFloat {
      0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-90vh) rotate(360deg) scale(1.4); opacity: 0; }
    }

    @keyframes armorFly {
      0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) rotate(720deg) scale(1.3); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mecha-card {
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 20%, #001a33 0%, #000510 70%, #000000 100%); /* Kartu gradasi navy ke hitam */
      border-radius: 4px;
      border: 3px solid #d4af37; /* Border kartu Emas Elegant */
      box-shadow: 0 0 35px rgba(0, 123, 255, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.4); /* Glow kartu Biru & Emas */
      padding: 20px 16px;
      position: relative;
      overflow: hidden;
    }

    .mecha-hud-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 1px), /* Grid dalam kartu emas transparan */
        linear-gradient(90deg, rgba(212, 175, 55, 0.12) 1px, transparent 1px);
      background-size: 14px 14px;
      pointer-events: none;
      z-index: 1;
    }

    .tech-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 3px solid #00e5ff; /* Siku kartu Biru Cyan */
      pointer-events: none;
      z-index: 5;
    }
    .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .mecha-logo {
      width: 100%;
      max-width: 380px;
      margin: 0 auto 12px;
      display: block;
      position: relative;
      z-index: 4;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.7)); /* Shadow logo Emas */
    }

    .banner-frame {
      position: relative;
      z-index: 4;
      border: 3px solid #007bff; /* Bingkai banner Biru */
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); /* Glow bingkai Emas */
      margin-bottom: 18px;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #007bff, #ffffff, #d4af37, transparent); /* Garis scan Biru/Emas */
      box-shadow: 0 0 10px #00e5ff;
      z-index: 6;
      animation: scanAnim 2.5s ease-in-out infinite alternate;
    }

    @keyframes scanAnim {
      0% { top: 0%; }
      100% { top: 96%; }
    }

    .btn-group {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
      position: relative;
      z-index: 4;
    }

    .mecha-btn {
      flex: 1;
      height: 52px;
      line-height: 52px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 17px;
      text-decoration: none;
      clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      position: relative;
      overflow: hidden;
      letter-spacing: 1.5px;
    }

    /* Tombol Daftar diubah menjadi Kuning Emas Elegant */
    .btn-red {
      color: #000000;
      background: linear-gradient(135deg, #b7950b 0%, #f4d03f 50%, #b7950b 100%); /* Gradasi Gold */
      border: 3px solid #ffffff; /* Border putih */
      animation: mechaPulseGold 0.8s infinite ease-in-out alternate, mechaShake 3s infinite ease-in-out;
    }

    /* Tombol Login diubah menjadi Biru Elegant */
    .btn-yellow {
      color: #ffffff;
      background: linear-gradient(135deg, #001a33 0%, #00509e 50%, #001a33 100%); /* Gradasi Biru Elegant */
      border: 3px solid #00e5ff; /* Border Biru Cyan */
      animation: mechaPulseBlue 0.8s infinite ease-in-out alternate, mechaShake 3s 1.5s infinite ease-in-out;
    }

    .mecha-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 50%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
      transform: rotate(35deg);
      animation: laserSweep 1.2s infinite linear;
    }

    .mecha-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 20%;
      height: 200%;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      transform: rotate(35deg);
      animation: laserSweep 1.2s 0.2s infinite linear;
    }

    /* Efek Pulse Tombol Daftar Kuning Emas */
    @keyframes mechaPulseGold {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.8), inset 0 0 5px #ffffff;
        filter: brightness(1) contrast(100%);
      }
      100% {
        transform: scale(1.05);
        box-shadow: 0 0 30px #d4af37, 0 0 15px #f4d03f, inset 0 0 12px #ffffff;
        filter: brightness(1.1) contrast(120%);
      }
    }

    /* Efek Pulse Tombol Login Biru Elegant */
    @keyframes mechaPulseBlue {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.8), inset 0 0 5px #ffffff;
        filter: brightness(1) contrast(100%);
      }
      100% {
        transform: scale(1.05);
        box-shadow: 0 0 30px #007bff, 0 0 15px #00e5ff, inset 0 0 12px #ffffff;
        filter: brightness(1.2) contrast(120%);
      }
    }

    @keyframes mechaShake {
      0%, 92%, 100% { transform: translateY(0) rotate(0deg); }
      93% { transform: translateY(-2px) rotate(-1deg); }
      95% { transform: translateY(2px) rotate(1deg); }
      97% { transform: translateY(-1px) rotate(0deg); }
    }

    @keyframes laserSweep {
      0% { left: -100%; }
      100% { left: 160%; }
    }

    .mecha-title {
      font-size: 12px;
      text-align: center;
      font-weight: 800;
      line-height: 1.4;
      color: #ffffff; 
      text-shadow: 0 0 10px rgba(0, 123, 255, 0.8); /* Shadow judul diubah ke Biru */
      margin-bottom: 10px;
      position: relative;
      z-index: 4;
      text-transform: uppercase;
    }

    .mecha-copyright {
      font-size: 11px;
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 4;
      font-weight: bold;
    }
    
    /* Menimpa Inline Style Warna HTML agar sesuai tema Biru-Gold */
    .mecha-copyright a, .mecha-copyright span {
      color: #d4af37;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }
  </style>
</head>
